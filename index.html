<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diamond Connect | Oficial</title>
    <meta name="description" content="Diamond Connect - Smartphones, consoles e tecnologia com parcelamento facilitado.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0A4D9C;
            --primary-light: #1677d2;
            --primary-dark: #06366d;
            --dark: #05070a;
            --dark-2: #080b10;
            --card: #10151c;
            --card-2: #131a23;
            --text: #ffffff;
            --muted: #aeb7c4;
            --border: rgba(10, 77, 156, 0.35);
            --green: #25D366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background:
                radial-gradient(circle at top right, rgba(10,77,156,.18), transparent 35%),
                var(--dark);
            color: var(--text);
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ================= HEADER ================= */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 82px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(5,7,10,.92);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            border-radius: 50%;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 800;
        }

        .brand-name span {
            color: var(--primary-light);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        nav a {
            color: #dce3eb;
            font-size: 14px;
            font-weight: 500;
            transition: .3s;
        }

        nav a:hover {
            color: #4b9bea;
        }

        .nav-button {
            background: var(--primary);
            padding: 11px 18px;
            border-radius: 10px;
            font-weight: 700;
        }

        .nav-button:hover {
            color: white;
            background: var(--primary-light);
        }

        /* ================= HERO ================= */

        .hero {
            min-height: 600px;
            padding: 80px 7%;
            display: grid;
            grid-template-columns: 1.05fr .95fr;
            align-items: center;
            gap: 50px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(10,77,156,.15);
            filter: blur(100px);
            border-radius: 50%;
            right: -150px;
            top: 40px;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            background: rgba(10,77,156,.12);
            color: #69aef2;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(38px, 5vw, 66px);
            line-height: 1.08;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 22px;
        }

        .hero h1 span {
            color: #2786df;
        }

        .hero p {
            max-width: 650px;
            color: var(--muted);
            line-height: 1.8;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: var(--primary);
            padding: 15px 24px;
            border-radius: 12px;
            font-weight: 800;
            transition: .3s;
        }

        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .btn-secondary {
            border: 1px solid #283341;
            background: #10151c;
            padding: 15px 24px;
            border-radius: 12px;
            font-weight: 700;
            transition: .3s;
        }

        .btn-secondary:hover {
            border-color: var(--primary);
        }

        .hero-checks {
            display: flex;
            gap: 25px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .check {
            color: #cbd4df;
            font-size: 13px;
        }

        .check strong {
            color: #43a0ee;
        }

        .hero-visual {
            min-height: 430px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background:
                radial-gradient(circle at center, rgba(10,77,156,.3), transparent 55%),
                linear-gradient(145deg, #111923, #070a0e);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,.35);
        }

        .hero-logo {
            width: 230px;
            height: 230px;
            object-fit: contain;
            border-radius: 50%;
            filter: drop-shadow(0 20px 40px rgba(10,77,156,.35));
        }

        .floating-card {
            position: absolute;
            background: rgba(10,15,22,.9);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 14px;
            backdrop-filter: blur(10px);
            font-size: 13px;
            font-weight: 700;
        }

        .floating-one {
            top: 35px;
            left: 25px;
        }

        .floating-two {
            bottom: 35px;
            right: 25px;
        }

        /* ================= SECTION ================= */

        .section {
            padding: 85px 7%;
        }

        .section-header {
            text-align: center;
            max-width: 750px;
            margin: 0 auto 45px;
        }

        .section-header .mini-title {
            color: #328fe2;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .section-header h2 {
            font-size: clamp(28px, 4vw, 42px);
            margin-bottom: 12px;
            font-weight: 800;
        }

        .section-header p {
            color: var(--muted);
            line-height: 1.7;
            font-size: 14px;
        }

        /* ================= DIFFERENTIALS ================= */

        .differentials {
            background: var(--dark-2);
            border-top: 1px solid rgba(255,255,255,.03);
            border-bottom: 1px solid rgba(255,255,255,.03);
        }

        .diff-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .diff-card {
            background: linear-gradient(145deg, #101720, #0b1016);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            transition: .3s;
        }

        .diff-card:hover {
            transform: translateY(-5px);
            border-color: rgba(40,134,223,.7);
        }

        .diff-icon {
            width: 48px;
            height: 48px;
            border-radius: 13px;
            background: rgba(10,77,156,.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .diff-card h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .diff-card p {
            color: var(--muted);
            line-height: 1.7;
            font-size: 13px;
        }

        /* ================= TABLE ================= */

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card);
        }

        .price-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        .price-table th {
            background: var(--primary);
            padding: 18px 20px;
            text-align: left;
            font-size: 13px;
            text-transform: uppercase;
        }

        .price-table td {
            padding: 17px 20px;
            border-bottom: 1px solid rgba(255,255,255,.06);
            font-size: 14px;
            color: #dce3eb;
        }

        .price-table tr:last-child td {
            border-bottom: none;
        }

        .price-table tr:hover td {
            background: rgba(10,77,156,.06);
        }

        /* ================= SHIPPING ================= */

        .shipping-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .shipping-card {
            text-align: center;
            padding: 32px 25px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
        }

        .shipping-icon {
            font-size: 34px;
            margin-bottom: 15px;
        }

        .shipping-card h3 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 17px;
        }

        .shipping-card p {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        /* ================= PRODUCTS ================= */

        .products-section {
            background: var(--dark-2);
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .product-card {
            background: linear-gradient(145deg, #111820, #0b1015);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            min-height: 245px;
            transition: .3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: rgba(40,134,223,.75);
            box-shadow: 0 15px 35px rgba(0,0,0,.25);
        }

        .product-type {
            color: #348fdf;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .product-card h3 {
            font-size: 17px;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .entry {
            color: var(--muted);
            font-size: 12px;
        }

        .installment {
            font-size: 26px;
            font-weight: 800;
            margin: 5px 0 20px;
        }

        .installment span {
            font-size: 12px;
            color: var(--muted);
            font-weight: 500;
        }

        .product-button {
            margin-top: auto;
            background: var(--green);
            color: #fff;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            transition: .3s;
        }

        .product-button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        /* ================= WHY ================= */

        .why-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .why-card {
            padding: 28px;
            border-radius: 18px;
            background: var(--card);
            border: 1px solid var(--border);
        }

        .why-card .icon {
            font-size: 25px;
            margin-bottom: 15px;
        }

        .why-card h3 {
            font-size: 17px;
            margin-bottom: 8px;
        }

        .why-card p {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        /* ================= ABOUT ================= */

        .about {
            background: var(--dark-2);
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .about-content h2 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .about-content p {
            color: var(--muted);
            line-height: 1.9;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 28px;
            border-radius: 18px;
            text-align: center;
        }

        .stat strong {
            display: block;
            color: #348fdf;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .stat span {
            color: var(--muted);
            font-size: 12px;
        }

        /* ================= REVIEWS ================= */

        .reviews {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .review {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 25px;
        }

        .stars {
            color: #ffd43b;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .review p {
            color: #dce3eb;
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 18px;
        }

        .review strong {
            color: #4b9bea;
            font-size: 13px;
        }

        /* ================= SECURITY ================= */

        .security {
            background:
                linear-gradient(145deg, rgba(10,77,156,.16), rgba(10,77,156,.03)),
                #080c11;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .security-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .security-card {
            text-align: center;
            padding: 28px;
        }

        .security-card .icon {
            font-size: 27px;
            margin-bottom: 12px;
        }

        .security-card h3 {
            font-size: 14px;
            margin-bottom: 7px;
        }

        .security-card p {
            color: var(--muted);
            font-size: 11px;
        }

        /* ================= CTA ================= */

        .cta {
            padding: 90px 7%;
            text-align: center;
        }

        .cta-box {
            max-width: 950px;
            margin: auto;
            padding: 60px 30px;
            border-radius: 30px;
            background:
                radial-gradient(circle at center, rgba(10,77,156,.3), transparent 65%),
                #0c1219;
            border: 1px solid var(--border);
        }

        .cta h2 {
            font-size: clamp(28px, 4vw, 45px);
            margin-bottom: 15px;
        }

        .cta p {
            color: var(--muted);
            max-width: 600px;
            margin: 0 auto 25px;
            line-height: 1.7;
            font-size: 14px;
        }

        /* ================= WHATSAPP ================= */

        .whatsapp {
            position: fixed;
            right: 25px;
            bottom: 25px;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 29px;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0,0,0,.45);
            transition: .3s;
        }

        .whatsapp:hover {
            transform: scale(1.08);
        }

        /* ================= FOOTER ================= */

        footer {
            padding: 40px 20px;
            text-align: center;
            background: #030405;
            border-top: 1px solid rgba(255,255,255,.05);
        }

        footer strong {
            color: #fff;
        }

        footer p {
            color: #68727e;
            font-size: 11px;
            margin-top: 8px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 1050px) {
            .products {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 850px) {

            header {
                height: auto;
                padding: 14px 5%;
                flex-direction: column;
                gap: 12px;
            }

            nav {
                gap: 14px;
                flex-wrap: wrap;
                justify-content: center;
            }

            nav a {
                font-size: 11px;
            }

            .hero {
                grid-template-columns: 1fr;
                padding: 55px 5%;
                text-align: center;
            }

            .hero p {
                margin-left: auto;
                margin-right: auto;
            }

            .hero-buttons,
            .hero-checks {
                justify-content: center;
            }

            .hero-visual {
                min-height: 320px;
            }

            .diff-grid,
            .shipping-grid,
            .why-grid,
            .security-grid {
                grid-template-columns: 1fr 1fr;
            }

            .products {
                grid-template-columns: repeat(2, 1fr);
            }

            .about-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .about-content {
                text-align: center;
            }

            .reviews {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 550px) {

            .brand-name {
                font-size: 17px;
            }

            .logo-img {
                width: 45px;
                height: 45px;
            }

            nav {
                gap: 9px;
            }

            nav a {
                font-size: 10px;
            }

            .nav-button {
                padding: 8px 10px;
            }

            .hero {
                padding-top: 40px;
            }

            .hero h1 {
                font-size: 38px;
                letter-spacing: -1px;
            }

            .hero-visual {
                min-height: 270px;
            }

            .hero-logo {
